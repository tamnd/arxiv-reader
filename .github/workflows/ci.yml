          sources:
            - id: "2501.00001"
              version: 3
              route: native
              url: https://arxiv.org/pdf/2501.00001v3
              path: work/pdf/2501/2501.00001v3.pdf
              sha256: $sum
              bytes: 9
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          cat > /tmp/native-page.txt <<'PAGE'
          arXiv:2501.00001v3 [cs.DL] 5 Jan 2026
                                                        A Paper About Nothing

          1   INTRODUCTION                              2   METHOD
             This paper is about nothing in par-           We did nothing at all and we did it
          ticular, and it says so at some length        carefully, which is the whole of the
          in a column narrow enough that every          method and wants no more words than
          line of it wraps where a typesetter           these to describe, and the heading over
          would have wrapped it on paper.               it has no gap under it anywhere.
             The second paragraph is indented
          the way the first one was, which is           ACKNOWLEDGMENTS
          what says where a paragraph starts and
          where the one above it ended.                    We thank nobody in particular.

          FIG. 1. A caption that opens with the         [1] A. Author, A paper about nothing,
          word figure and a number, which is the            Journal of Nothing 1, 1 (2001).
          whole of what says it is a caption.           [2] B. Author, Another paper about
                                                            nothing at all, Journal of Nothing
                                                            2, 2 (2002).
                                                        [3] C. Author, A third paper about
                                                            nothing, J. Nothing 3, 3 (2003).
          PAGE
