          printf '\f'
          SH
          chmod +x /tmp/stub-pdftotext
          ARXIV_CORPUS=/tmp/native-corpus ax extract native -n -pdftotext /tmp/stub-pdftotext 2501.00001v3 2>&1 | tee /tmp/native.txt
