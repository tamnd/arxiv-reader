          # which is how the program has always behaved, so the stub does too.
          # A form feed ends every page, including the last.
          cat > /tmp/stub-pdftotext <<'SH'
          #!/bin/sh
          case "$1" in -v) echo "a stub reader, and not pdftotext" >&2; exit 99;; esac
