          grep -q "{#thm-2 .statement tag=VNYA" $dir/02_results.md
          if grep -q "{#thm-1 .statement tag=VNYA" $dir/02_results.md; then
            echo "the tag of the old theorem was handed to the one that took its number"
            exit 1
          fi
          # The register belongs to v4 now, so carrying it from v3 again would
          # point every tag in it at whatever has that identifier this time.
          if ARXIV_CORPUS=/tmp/diff-corpus ax tags diff 2501.00001 -from v3 -to v4 -w; then
            echo "a register was carried from a version it was not assigned against"
            exit 1
          fi
          ARXIV_CORPUS=/tmp/diff-corpus ax tags diff 2501.00001 -from v3 -to v4 -w 2>&1 | grep -q "assigned against v4"
      - name: tags refuses the arguments it should refuse
        run: |
          for c in "tags" "tags assign" "tags verify" "tags assign not-an-arxiv-id" "tags assign 2502.00002" "tags diff" "tags diff 2501.00001" "tags diff 2501.00001 -from v4 -to v3" "tags diff 2501.00001 -from v3 -to v9" "tags diff not-an-arxiv-id -from v1 -to v2" "tags diff 2501.00001 2501.00002 -from v3 -to v4"; do
            if ARXIV_CORPUS=/tmp/extract-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
      # Groups S, T, M, F, R, G and X over the paper the steps above built,
      # fetched, rendered, split, figured, tabled, referenced and tagged. Every
      # rule has to say pass and not "not run": a rule with nothing to look at
      # has not passed anything, and telling those two apart is what the four
      # states are for.
      # G08 reads the repository rather than the corpus, so the corpus has to be
      # one. A tombstone goes in first, because a register of a paper that has
      # been revised has one in it and both G07 and G08 have to have something
      # real to read.
      - name: the corpus is a repository with a history in it
        run: |
          printf '%s\n' 'ZZZZ,eq-7,gone:v2,"removed when section 4 was rewritten"' >> /tmp/extract-corpus/tags/2501/2501.00001.tags
          git -C /tmp/extract-corpus init -q -b main
          git -C /tmp/extract-corpus add -A
          git -C /tmp/extract-corpus -c user.email=ax@example.com -c user.name=ax commit -q -m "the corpus"
      - name: the content plane audit is clean over the paper the tools just built
        run: |
          ARXIV_CORPUS=/tmp/extract-corpus ax audit -plane content -q | tee /tmp/audit-content.txt
          grep -q "3 files over 1 paper, nothing found" /tmp/audit-content.txt
          test "$(grep -cE '^[STMFRGX][0-9]+ +pass ' /tmp/audit-content.txt)" = 56
          if grep -q "not run" /tmp/audit-content.txt; then
            echo "a content rule had nothing to look at"
            exit 1
          fi
      # And the same fifty six rules over nothing at all, which has to read as
      # not run rather than as a clean corpus. A green audit over an empty plane
      # is the single easiest way for this project to lie to itself.
      - name: an empty content plane runs nothing rather than passing everything
        run: |
          rm -rf /tmp/empty-corpus && mkdir -p /tmp/empty-corpus
          ARXIV_CORPUS=/tmp/empty-corpus ax audit -plane content -q | tee /tmp/audit-empty.txt
          grep -q "0 files over 0 papers, nothing to check" /tmp/audit-empty.txt
          test "$(grep -cE '^[STMFRGX][0-9]+ +not run ' /tmp/audit-empty.txt)" = 56
      # Each rule fired by breaking the one thing it is about. A rule that has
      # only ever been watched passing is a rule nobody has tested.
      - name: a content file that is wrong fails the rule that is about it
        run: |
          front=/tmp/broken-corpus/content/en/2501/2501.00001/00_front.md
          intro=/tmp/broken-corpus/content/en/2501/2501.00001/01_introduction.md
          results=/tmp/broken-corpus/content/en/2501/2501.00001/02_results.md
          reg=/tmp/broken-corpus/tags/2501/2501.00001.tags
          man=/tmp/broken-corpus/manifests/figures/2501.yaml
          tab=/tmp/broken-corpus/tables/2501/2501.00001
          bib=/tmp/broken-corpus/manifests/refs/2501/2501.00001.yaml
          copy() { rm -rf /tmp/broken-corpus && cp -r /tmp/extract-corpus /tmp/broken-corpus; }
          # Appending to a body moves it away from its recorded hash, which is
          # T03's finding and not the one under test, so the cases that append
          # restamp it the way a person correcting a file by hand would.
          restamp() { ARXIV_CORPUS=/tmp/broken-corpus ax split -accept 2501.00001 > /dev/null; }
          # add puts a paragraph on the end of a file, one argument per line,
          # with a blank line in front of it so it does not join the paragraph
          # that was already there.
          add() { f=$1; shift; printf '\n' >> $f; printf '%s\n' "$@" >> $f; }
          fails() {
            if ARXIV_CORPUS=/tmp/broken-corpus ax audit -plane content -q > /tmp/broken.txt 2>&1; then
              echo "the audit passed a corpus broken for $1"
              cat /tmp/broken.txt
              exit 1
            fi
            if ! grep -qE "^$1 +fail " /tmp/broken.txt; then
              echo "$1 did not fire"
              cat /tmp/broken.txt
              exit 1
            fi
          }
          # A soft rule is checked the other way round, because it is not
          # allowed to fail the build. The audit has to come back clean and the
          # rule has to have found something anyway.
          soft() {
            if ! ARXIV_CORPUS=/tmp/broken-corpus ax audit -plane content -q > /tmp/broken.txt 2>&1; then
              echo "$1 is soft and it failed the build"
              cat /tmp/broken.txt
              exit 1
            fi
            if ! grep -qE "^$1 +fail " /tmp/broken.txt; then
              echo "$1 did not fire"
              cat /tmp/broken.txt
              exit 1
            fi
          }
          copy && echo "no front matter here at all" > $intro && fails T01
          copy && sed -i 's/^kind: section$/kind: section\nsection_kind: appendix/' $intro && fails T02
          copy && echo "A sentence somebody added by hand." >> $intro && fails T03
          copy && sed -i 's/^section: 1$/section: 5/' $intro && fails T04
          copy && printf '\n##### Five levels down\n\nSomething under it.\n' >> $intro && restamp && fails T05
          copy && rm /tmp/broken-corpus/content/en/2501/2501.00001/00_front.md && fails T06
          copy && printf '\narXiv:2501.00001v3 [math.NT] 2 Jan 2025\n' >> $intro && restamp && fails T10
          copy && printf '\n<table><tr><td>1.0</td></tr></table>\n' >> $intro && restamp && fails T11
          # The mathematics. Eleven of the twelve are one paragraph appended to
          # a body, because that is what a correction that went wrong looks
          # like, and each of the eleven fires on its own.
          copy && add $intro 'The cost is $n + 1 and nothing else.' && restamp && fails M01
          copy && add $intro 'Every point of $\R$ is a limit.' && restamp && fails M02
          copy && add $intro 'The bound is \frac{1}{2} of nothing.' && restamp && fails M03
          copy && add $intro 'The constant is [illegible] in the printed copy.' && restamp && fails M05
          copy && add $intro 'We know (see $x)$ that nothing converges.' && restamp && fails M07
          copy && add $intro '$$' 'a = 1 \\' 'b = 2' '$$' && restamp && fails M08
          copy && add $intro 'The term $x^{a}^{b}$ is in every row.' && restamp && soft M09
          copy && add $intro 'The claim is that $a \not b$ holds.' && restamp && fails M10
          copy && add $intro '\[' 'a = 1' '\]' && restamp && fails M11
          copy && add $intro 'The value $ x + 1 $ is the one.' && restamp && soft M12
          copy && add $intro '```' 'echo $HOME' '```' && restamp && fails M13
          # The twelfth is the one rule in the group that reads a paper rather
          # than a formula, so it is broken by taking every dollar in the paper
          # out and leaving the mathematics sitting in the prose. It fires with
          # M03 beside it, which is the point: a paper whose formulas were
          # dissolved is wrong in more than one way and green in none of them.
          copy && sed -i 's/\$//g' $front $intro $results && add $intro 'The step α is at most β whenever γ is small.' && restamp && fails M14
          # The register on its own, then the copy on its own, then the two
          # disagreeing. A tag lives in the register and in the file it was
          # written into, so each of those three is a different way for a paper
          # to end up with a name nothing resolves.
          copy && echo "ABC,s9" >> $reg && fails G01
          copy && printf '\nSee [Theorem 1](#VNYA) for the rest.\n' >> $intro && restamp && fails G02
          copy && echo "VIS1,s9" >> $reg && fails G03
          copy && echo "ZZZZ,s1" >> $reg && fails G04
          copy && sed -i 's/^tag: VIS1$/tag: ZZZZ/' $intro && fails G05
          copy && sed -i 's/ tag=VNYA//' $results && restamp && fails G06
          copy && sed -i 's/^ZZZZ,eq-7,gone:v2,/ZZZZ,eq-7,v2,/' $reg && fails G07
          # The one rule that reads the repository. The line is gone from the
          # file, so the corpus on its own cannot tell you it was ever there.
          copy && sed -i '/^ZZZZ,eq-7,/d' $reg && fails G08
          copy && sed -i 's/{#thm-1 .statement/{#thm-1 .theorem/' $results && restamp && fails X01
          # The pictures and the tables. A figure is a decision in the
          # manifest, bytes on disk and a line in a body, and these are the ways
          # those three come apart. The first is the one that matters most: a
          # body pointing back at arXiv is a paper ax figures has never been run
          # over, which is how every one of these starts out.
          copy && sed -i 's#](/figures/2501/2501.00001/nothing.svg)#](2501.00001v3/nothing.svg)#' $intro && restamp && fails F01
          copy && sed -i 's/^      width: 384$/      width: 20/' $man && fails F02
          copy && sed -i 's/^      bytes: 375$/      bytes: 999999/' $man && fails F03
          copy && sed -i 's/^      page_fraction: 0.1283$/      page_fraction: 0.9/' $man && fails F06
          copy && sed -i 's/^      caption: (\*\*Overview\*\*.) Nothing, drawn.$/      caption: ""/' $man && fails F07
          copy && sed -i 's/^access: open$/access: record/' $front $intro $results && fails F08
          copy && sed -i 's/^      third_party: owned$/      third_party: suspected/' $man && fails F09
          copy && add $intro 'The proof is in Figure 9, which nobody drew.' && restamp && soft F10
          copy && rm $tab/t01.tex && fails F11
          copy && sed -i 's/0\.1/0.2/' $tab/t01.tex && fails F12
          # F05 is the one that needs a second figure, because one picture
          # committed twice is two entries and the corpus has two entries only
          # when something went wrong. The copy points at the bytes that are
          # already there, which is exactly the shape the rule is about.
          copy
          sum=$(grep -A2 'source: 2501.00001v3/nothing.svg' $man | grep sha256 | awk '{print $2}')
          printf '%s\n' \
            '    - paper: "2501.00001"' \
            '      version: 3' \
            '      number: "9"' \
            '      source: 2501.00001v3/again.svg' \
            '      file: /figures/2501/2501.00001/nothing.svg' \
            "      sha256: $sum" \
            '      bytes: 375' \
            '      format: svg' \
            '      third_party: owned' \
            '      caption: The same picture, committed a second time.' \
            '      licence: cc-by' >> $man
          fails F05
          # The bibliography and the edges built out of it. Four of the six read
          # the metadata plane the steps above filled, which is why these come
          # after the resolve and not with the rest of the content rules. T12 is
          # here too, because a link is only a link into nothing once the
          # bibliography is there to say it is not an entry.
          copy && add $intro 'The idea comes from arXiv:2401.99999 originally.' && restamp && fails R01
          copy && add $intro 'The bound is due to [9](#bib.bibx9), who proved it first.' && restamp && fails R02
          copy && sed -i 's/^      text: N. Nobody. On nothing. 1999.$/      text: ""/' $bib && fails R03
          copy && sed -i 's/^      title: Nothing In Particular, Revisited$/      title: Something Else Entirely/' $bib && soft R04
          copy && sed -i 's/^      resolved: "2303.00002"$/      resolved: "2501.00001"/' $bib && fails R05
          copy && sed -i 's/^      year: 1999$/      year: 2030/' $bib && soft R06
          copy && add $intro 'The proof is in [Appendix C](#app-c), which nobody wrote.' && restamp && fails T12
          # The licence gate read back off the files. S01 is broken in every
          # file of the paper rather than in one, because the access class is a
          # fact about the paper and a corpus where one file of three disagrees
          # is a different defect from the one this rule is about.
          copy && sed -i 's/^access: open$/access: verbatim/' $front $intro $results && fails S01
          copy && rm /tmp/broken-corpus/metadata/2501.jsonl && fails S04
          copy && sed -i 's/^version: v3$/version: v9/' $intro && fails S07
          copy && sed -i 's/^licence_from: abs$/licence_from: kaggle/' $intro && fails S10
          copy && sed -i 's/^licence: CC-BY-4.0$/licence: CC-BY-SA-4.0/' $intro && fails S12
      - name: the audit refuses the arguments it should refuse
        run: |
          for c in "audit --plane both" "audit -rules S99" "audit -rules" "audit -cap 0" "audit -shard 2113" "audit meta"; do
            if ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
          # A rule belongs to one plane, and asking for a metadata rule over the
          # content plane is a question with no answer rather than an empty one.
          for c in "audit -plane content -rules S14" "audit -plane meta -rules T05" "audit -plane content -shard 2113"; do
            if ARXIV_CORPUS=/tmp/extract-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
