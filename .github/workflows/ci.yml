name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes anything, so nothing in it gets a write
# token. A job that needs one asks for it by name.
permissions:
  contents: read

# A push that lands while an older run is still going cancels it, except on
# main, where every commit gets a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.1"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: build
        run: go build -trimpath ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Pinned, and it has to be a release that knows about the Go version
      # above. staticcheck reads the compiler's export data and a release older
      # than the toolchain gives up with "export data version 4 is greater than
      # maximum supported version 2" rather than a finding.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: staticcheck ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Reports only the vulnerabilities this code actually reaches, so a
      # finding here is a call path and not a version number in go.sum.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The commands that exist have to keep working, and the commands that do not
  # exist yet have to keep saying so. The second half matters more than it
  # looks: a verb that quietly exits zero while doing nothing is the failure
  # this whole command table is shaped to avoid.
  #
  # The job that checks out tamnd/arxiv and runs the audit over the real corpus
  # arrives with the audit, in M3.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        run: go build -trimpath -o /usr/local/bin/ax ./cmd/ax
      - name: the command set is listed
        run: ax help
      - name: an id parses, in both of arXiv's schemes
        run: |
          ax id parse 2106.09685v2
          ax id parse hep-th/9711200
      - name: every licence explains itself
        run: ax licence explain all
      - name: an empty corpus reports an empty metadata plane
        run: |
          mkdir -p /tmp/empty-corpus
          ARXIV_CORPUS=/tmp/empty-corpus ax harvest status
          n=$(ARXIV_CORPUS=/tmp/empty-corpus ax harvest status -total)
          if [ "$n" != "0" ]; then
            echo "an empty corpus reported $n records"
            exit 1
          fi
      - name: a command that is not written yet exits non-zero
        run: |
          if ax translate --lang vi; then
            echo "translate exited zero without doing anything"
            exit 1
          fi
          if ax report coverage; then
            echo "report exited zero without reporting anything"
            exit 1
          fi
      # These reach no further than the argument check, which is the point. CI
      # does not talk to arXiv: a job that harvests on every push is a job that
      # gets this project blocked.
      - name: a harvest refuses the arguments it should refuse
        run: |
          if ax harvest oai; then
            echo "an unbounded harvest was allowed, and that asks arXiv for the whole archive"
            exit 1
          fi
          if ax harvest oai -from 2024-03-05T00:00:00Z -until 2024-03-05; then
            echo "a timestamp was accepted where a date belongs"
            exit 1
          fi
          if ax harvest oai -format oai_dc -limit 1; then
            echo "a metadata format arXiv does not serve was accepted"
            exit 1
          fi
          if ax harvest oai -from 2024-03-06 -until 2024-03-05; then
            echo "a backwards date range was accepted"
            exit 1
          fi
          if ax harvest kaggle; then
            echo "a snapshot harvest with no file was allowed"
            exit 1
          fi
          if ax harvest kaggle /tmp/does-not-exist.json; then
            echo "a snapshot harvest of a missing file exited zero"
            exit 1
          fi
          : > /tmp/snapshot.json.gz
          if ax harvest kaggle /tmp/snapshot.json.gz; then
            echo "a packed file was read as if it were JSON"
            exit 1
          fi
          if ax harvest hf; then
            echo "a mirror harvest with neither a file nor -rows was allowed"
            exit 1
          fi
          if ax harvest hf -rows; then
            echo "an unbounded rows walk was allowed, and that is thirty thousand requests"
            exit 1
          fi
          if ax harvest hf -rows /tmp/snapshot.json.gz; then
            echo "-rows accepted a file it is not going to read"
            exit 1
          fi
          if ax harvest hf -dataset someone/mirror /tmp/snapshot.json.gz; then
            echo "a rows only flag was accepted on the file path"
            exit 1
          fi
          if ax harvest hf -rows -limit 1 -offset -5; then
            echo "an offset before the start of the split was accepted"
            exit 1
          fi
      - name: a snapshot harvest reads a snapshot
        run: |
          mkdir -p /tmp/snap-corpus
          printf '%s\n' '{"id":"2106.09685","title":"LoRA","abstract":"a","categories":"cs.CL","license":"http://creativecommons.org/licenses/by/4.0/","versions":[{"version":"v1","created":"Thu, 17 Jun 2021 00:00:00 GMT"}],"authors_parsed":[["Hu","Edward J.",""]]}' > /tmp/snapshot.json
          ARXIV_CORPUS=/tmp/snap-corpus ax harvest kaggle /tmp/snapshot.json
          n=$(ARXIV_CORPUS=/tmp/snap-corpus ax harvest status -total)
          if [ "$n" != "1" ]; then
            echo "the plane holds $n records after a one record snapshot"
            exit 1
          fi
          # Reading the same file twice must change nothing, or every harvest
          # is a commit and the history stops meaning anything.
          ARXIV_CORPUS=/tmp/snap-corpus ax harvest kaggle /tmp/snapshot.json | grep -q "1 unchanged"
          # The mirror reads the same file and the only thing that changes is
          # which mirror it says it came from.
          mkdir -p /tmp/hf-corpus
          ARXIV_CORPUS=/tmp/hf-corpus ax harvest hf /tmp/snapshot.json
          grep -q '"source":"hf"' /tmp/hf-corpus/metadata/2106.jsonl
          grep -q '"source":"kaggle"' /tmp/snap-corpus/metadata/2106.jsonl
      # An empty plane is the case the four states exist for. A rule that says
      # pass here is a rule that will say pass for the rest of the project
      # without ever having looked at anything.
      - name: an empty plane audits as not run rather than pass
        run: |
          out=$(ARXIV_CORPUS=/tmp/empty-corpus ax audit --plane meta)
          echo "$out"
          echo "$out" | grep -q "not run"
          echo "$out" | grep -q "0 records over 0 months, nothing to check"
          if echo "$out" | grep -q "pass"; then
            echo "a rule passed over an empty plane"
            exit 1
          fi
      - name: a clean plane passes every rule, having checked something
        run: |
          out=$(ARXIV_CORPUS=/tmp/snap-corpus ax audit --plane meta -report /tmp/audit.md)
          echo "$out"
          echo "$out" | grep -q "1 record over 1 month, nothing found"
          if echo "$out" | grep -q "not run"; then
            echo "a rule had nothing to look at in a plane with a record in it"
            exit 1
          fi
          grep -q "| Sources |" /tmp/audit.md
      # The exit code is the whole point of the command in CI. A findings list
      # nobody reads and a green build is worse than no audit at all.
      - name: a broken record fails the build
        run: |
          mkdir -p /tmp/bad-corpus/metadata
          sed 's/"source":"kaggle"/"source":"arxiv.org"/' /tmp/snap-corpus/metadata/2106.jsonl > /tmp/bad-corpus/metadata/2106.jsonl
          if ARXIV_CORPUS=/tmp/bad-corpus ax audit --plane meta; then
            echo "a record read from nowhere passed the audit"
            exit 1
          fi
          ARXIV_CORPUS=/tmp/bad-corpus ax audit --plane meta 2>&1 | grep -q "metadata/2106.jsonl:1"
      # No -fetch anywhere in CI. The committed copy of arXiv's counts is there
      # so this runs without asking arXiv for anything.
      - name: the harvest report counts the corpus against arXiv's own numbers
        run: |
          out=$(ARXIV_CORPUS=/tmp/snap-corpus ax harvest report)
          echo "$out"
          # One record of the three million arXiv has announced, so the useful
          # assertion is the yardstick, not the coverage.
          echo "$out" | grep -q "1 record of 3,1"
          echo "$out" | grep -q "months with nothing in them"
          grep -q "^# The harvest" /tmp/snap-corpus/reports/harvest.md
          grep -q "^| 2021-06 | 1 |" /tmp/snap-corpus/reports/harvest.md
      - name: an empty corpus reports every month as a gap
        run: |
          ARXIV_CORPUS=/tmp/empty-corpus ax harvest report -q -o /tmp/empty-harvest.md
          grep -q "^| 2021-06 | 0 |" /tmp/empty-harvest.md
      - name: the harvest report refuses the arguments it should refuse
        run: |
          for c in "harvest report -save /tmp/x.csv" "harvest report extra"; do
            if ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
      # The one record in the snapshot corpus is cc-by, so the census has one
      # paper to count and it is one that may be translated.
      - name: the licence census counts what may be translated
        run: |
          out=$(ARXIV_CORPUS=/tmp/snap-corpus ax licence census)
          echo "$out"
          echo "$out" | grep -q "Of 1 paper counted, 1 may be translated"
          grep -q "^# The licence census" /tmp/snap-corpus/reports/licence.md
          grep -q "^| cc-by | 1 | 100.0% | open | yes | yes |" /tmp/snap-corpus/reports/licence.md
          grep -q "^| cs | 1 | 1 | 1 |" /tmp/snap-corpus/reports/licence.md
          # The number is an upper bound and the report has to say so in the
          # same breath it says the number, because the headline is the part
          # that gets quoted.
          grep -q "upper bounds" /tmp/snap-corpus/reports/licence.md
          grep -q "^## Why this is an upper bound" /tmp/snap-corpus/reports/licence.md
      - name: an empty plane counts nothing rather than nothing translatable
        run: |
          ARXIV_CORPUS=/tmp/empty-corpus ax licence census -q -o /tmp/empty-licence.md
          grep -q "Nothing counted, because the metadata plane is empty." /tmp/empty-licence.md
          if grep -q "0.0%" /tmp/empty-licence.md; then
            echo "an empty plane reported a percentage of nothing"
            exit 1
          fi
      - name: the licence census refuses the arguments it should refuse
        run: |
          for c in "licence census -shard 2113" "licence census extra" "licence census -shard 2106"; do
            if ARXIV_CORPUS=/tmp/empty-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
      # Every one of these stops at the argument check, which is the point.
      # ax licence resolve reads the website, and a job that reads the website
      # on every push is a job that gets this project blocked.
      - name: the licence resolver refuses the arguments it should refuse
        run: |
          if ax licence resolve; then
            echo "a resolve with nothing to resolve was allowed"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/empty-corpus ax licence resolve 2203.09431; then
            echo "a bare id was accepted, and reading the latest version learns nothing"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/empty-corpus ax licence resolve -all 2203.09431; then
            echo "-all was accepted for a paper the plane has never heard of"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/empty-corpus ax licence resolve -pace 1s 2203.09431v1; then
            echo "a pace faster than the one arXiv asks for was accepted"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/empty-corpus ax licence resolve not-an-arxiv-id; then
            echo "a reference that is not one was accepted"
            exit 1
          fi
      # These stop at the argument check too. ax licence crosscheck reads the
      # Hugging Face datasets server, and a walk with no limit on it is about
      # six hours, so the one thing this job must never do is let a default
      # through.
      - name: the crosscheck refuses the arguments it should refuse
        run: |
          if ARXIV_CORPUS=/tmp/empty-corpus ax licence crosscheck; then
            echo "a walk with no limit was allowed, and the whole collection is about six hours"
            exit 1
          fi
          for c in "licence crosscheck -limit 0" "licence crosscheck -limit -1" "licence crosscheck -against wikipedia -limit 5" "licence crosscheck -limit 5 -pace 1s" "licence crosscheck -limit 5 extra"; do
            if ARXIV_CORPUS=/tmp/empty-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
      # ax fetch reads the website at fifteen seconds a page, so none of this
      # reaches the network. The gate is what keeps it there: every one of these
      # is refused before a request is made, which is the behaviour worth
      # testing anyway.
      - name: the fetch refuses the arguments it should refuse
        run: |
          if ax fetch; then
            echo "a fetch with no subcommand was allowed"
            exit 1
          fi
          for c in "fetch render" "fetch render -pace 1s 2312.00752v2" "fetch render not-an-arxiv-id" "fetch source" "fetch source -pace 1s 2312.00752v2" "fetch source not-an-arxiv-id" "fetch verify extra" "fetch sideways"; do
            if ARXIV_CORPUS=/tmp/empty-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
          if ARXIV_CORPUS=/tmp/empty-corpus ax fetch render 2312.00752v2; then
            echo "a fetch of a paper the plane has never heard of was allowed"
            exit 1
          fi
      # The snapshot corpus holds one cc-by paper whose licence came from
      # Kaggle, which states one licence for the whole paper. That is exactly
      # the case the gate exists for, and it has to be refused even though the
      # licence it names is the permissive one.
      - name: the licence gate refuses a paper level licence
        run: |
          out=$(ARXIV_CORPUS=/tmp/snap-corpus ax fetch render 2106.09685v1 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "kaggle"
          echo "$out" | grep -q "ax licence resolve"
          if ARXIV_CORPUS=/tmp/snap-corpus ax fetch render 2106.09685v1; then
            echo "a licence read from a bulk surface was accepted as a licence for a version"
            exit 1
          fi
          if [ -e /tmp/snap-corpus/work ] || [ -e /tmp/snap-corpus/manifests ]; then
            echo "a refused fetch wrote into the corpus"
            exit 1
          fi
      # The source path is the fallback for every paper arXiv never rendered,
      # which is most of the archive, so a gate that only held on the render
      # route would be a gate with a way around it.
      - name: the licence gate refuses the source route as well
        run: |
          out=$(ARXIV_CORPUS=/tmp/snap-corpus ax fetch source 2106.09685v1 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "ax licence resolve"
          if ARXIV_CORPUS=/tmp/snap-corpus ax fetch source 2106.09685v1; then
            echo "the source route fetched past the licence gate"
            exit 1
          fi
          if [ -e /tmp/snap-corpus/work ]; then
            echo "a refused fetch wrote into the corpus"
            exit 1
          fi
      - name: the manifest verifies against the disk
        run: |
          mkdir -p /tmp/fetch-corpus/work/html/2312 /tmp/fetch-corpus/manifests
          echo "a rendering" > /tmp/fetch-corpus/work/html/2312/2312.00752v2.html
          sum=$(sha256sum /tmp/fetch-corpus/work/html/2312/2312.00752v2.html | cut -d' ' -f1)
          cat > /tmp/fetch-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2312.00752"
              version: 2
              route: render
              url: https://arxiv.org/html/2312.00752v2
              path: work/html/2312/2312.00752v2.html
              sha256: $sum
              bytes: 12
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          ARXIV_CORPUS=/tmp/fetch-corpus ax fetch verify 2>&1 | tee /tmp/verify.txt
          grep -q "1 ok" /tmp/verify.txt
          # A changed file is the whole reason the manifest holds hashes, and it
          # has to be a non-zero exit rather than a line in a log.
          echo "somebody edited this" > /tmp/fetch-corpus/work/html/2312/2312.00752v2.html
          if ARXIV_CORPUS=/tmp/fetch-corpus ax fetch verify; then
            echo "a file that no longer hashes to the manifest exited zero"
            exit 1
          fi
          # A missing file is the ordinary state of a fresh clone, because
          # work/ is not committed, so it is reported and not failed.
          rm /tmp/fetch-corpus/work/html/2312/2312.00752v2.html
          ARXIV_CORPUS=/tmp/fetch-corpus ax fetch verify 2>&1 | grep -q "1 missing"
      - name: a manifest entry that records nothing is refused
        run: |
          mkdir -p /tmp/bad-manifest/manifests
          printf 'sources:\n  - id: "2312.00752"\n    version: 2\n' > /tmp/bad-manifest/manifests/sources.yaml
          if ARXIV_CORPUS=/tmp/bad-manifest ax fetch verify; then
            echo "an entry with no hash was read as a manifest entry"
            exit 1
          fi
      - name: the extract refuses the arguments it should refuse
        run: |
          if ax extract; then
            echo "an extract with no subcommand was allowed"
            exit 1
          fi
          for c in "extract render" "extract render -n 2312.00752" "extract render -n not-an-arxiv-id" "extract sideways -n 2312.00752v2" "extract render 2312.00752v2" "extract source" "extract source -n not-an-arxiv-id"; do
            if ARXIV_CORPUS=/tmp/empty-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
          # The manifest and not the disk says where a rendering is, so a
          # version nobody recorded is refused even in a corpus that has one.
          if ARXIV_CORPUS=/tmp/empty-corpus ax extract render -n 2312.00752v2; then
            echo "a rendering the manifest has never heard of was read anyway"
            exit 1
          fi
      # The fixture is a rendering of a paper that does not exist, built out of
      # the markup shapes arXiv's own renderings use. Running the whole command
      # over it is the only way to know the reader and the report still agree.
      - name: a rendering is read end to end
        run: |
          mkdir -p /tmp/extract-corpus/work/html/2501 /tmp/extract-corpus/manifests
          cp extract/testdata/rendering.html /tmp/extract-corpus/work/html/2501/2501.00001v3.html
          sum=$(sha256sum /tmp/extract-corpus/work/html/2501/2501.00001v3.html | cut -d' ' -f1)
          cat > /tmp/extract-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2501.00001"
              version: 3
              route: render
              url: https://arxiv.org/html/2501.00001v3
              path: work/html/2501/2501.00001v3.html
              sha256: $sum
              bytes: 1
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render -n -outline 2501.00001v3 | tee /tmp/extract.txt
          grep -q "A Paper About Nothing" /tmp/extract.txt
          grep -q "Ada First, Bo Second" /tmp/extract.txt
          grep -q "CC BY 4.0" /tmp/extract.txt
          grep -q "faults      1, 0 of them inside the body" /tmp/extract.txt
          # The one fault is in the bibliography, which is a reference that
          # prints badly and not a sentence of the paper that is gone.
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render -n 2501.00001v3
      - name: a rendering of the wrong version is refused
        run: |
          mkdir -p /tmp/swapped-corpus/work/html/2501 /tmp/swapped-corpus/manifests
          cp extract/testdata/rendering.html /tmp/swapped-corpus/work/html/2501/2501.00001v2.html
          sum=$(sha256sum /tmp/swapped-corpus/work/html/2501/2501.00001v2.html | cut -d' ' -f1)
          cat > /tmp/swapped-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2501.00001"
              version: 2
              route: render
              url: https://arxiv.org/html/2501.00001v2
              path: work/html/2501/2501.00001v2.html
              sha256: $sum
              bytes: 1
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          out=$(ARXIV_CORPUS=/tmp/swapped-corpus ax extract render -n 2501.00001v2 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "says it is of v3"
          if ARXIV_CORPUS=/tmp/swapped-corpus ax extract render -n 2501.00001v2; then
            echo "a rendering of one version was read as another"
            exit 1
          fi
      # The writing half. The reading half above runs with -n and never puts a
      # file down, and everything that matters about this stage is what the
      # files say and what happens on the second run.
      - name: a paper is written into the content plane
        run: |
          mkdir -p /tmp/extract-corpus/metadata
          printf '%s\n' '{"id":"2501.00001","title":"A Paper About Nothing","abstract":"We say nothing.","authors":[{"surname":"First","forename":"Ada"},{"surname":"Second","forename":"Bo"}],"categories":["cs.LG"],"versions":[{"version":3,"created":"2025-02-02T00:00:00Z","licence":"cc-by","licence_from":"abs"}],"source":"oai","harvested":"2026-09-14"}' > /tmp/extract-corpus/metadata/2501.jsonl
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render 2501.00001v3 | tee /tmp/write.txt
          grep -q "3 written, 0 unchanged" /tmp/write.txt
          dir=/tmp/extract-corpus/content/en/2501/2501.00001
          test -f $dir/00_front.md
          test -f $dir/01_introduction.md
          test -f $dir/02_results.md
          # The licence is the reason this project is allowed to exist, so it is
          # on every file rather than in one place somebody has to go and look.
          grep -q "^licence: CC-BY-4.0" $dir/01_introduction.md
          grep -q "^licence_from: abs" $dir/01_introduction.md
          grep -q "^access: open" $dir/01_introduction.md
          # The author list comes from the metadata plane and not from the
          # byline in the rendering.
          grep -q "  - Ada First" $dir/01_introduction.md
          # A section that is a whole file has its title in the front matter,
          # because repeating it in the body gives every page two titles.
          grep -q "^section_title: Introduction" $dir/01_introduction.md
          grep -q "^local_id: s1" $dir/01_introduction.md
          # Every object carries its attribute block on the line it starts,
          # which is what makes the Markdown the source of truth rather than a
          # rendering of one.
          grep -q "{#thm-1 .statement env=theorem}" $dir/02_results.md
          grep -q "{#fig-2 .figure}" $dir/02_results.md
          grep -q "{#tab-1 .table}" $dir/02_results.md
          grep -q "{#lst-1 .code}" $dir/02_results.md
          grep -q "{#eq-1a .equation}" $dir/01_introduction.md
          # Every cross reference points at a local identifier. A corpus whose
          # internal links point at LaTeXML's own anchors is a corpus whose
          # links go nowhere.
          if grep -q "](#S" $dir/*.md; then
            echo "a cross reference still points at a rendering anchor"
            exit 1
          fi
      # git status after a re-run of a finished paper is empty, and that is the
      # test that this stage is honest rather than a claim about it.
      - name: writing the same paper twice writes nothing
        run: |
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render 2501.00001v3 | tee /tmp/again.txt
          grep -q "0 written, 3 unchanged" /tmp/again.txt
          ARXIV_CORPUS=/tmp/extract-corpus ax split 2501.00001v3 | grep -q "3 files of 2501.00001, 0 corrected"
      # A person's work outranks a re-run of a converter. This is the whole
      # reason the content plane is Markdown rather than a database.
      - name: a hand correction is noticed and is not thrown away
        run: |
          dir=/tmp/extract-corpus/content/en/2501/2501.00001
          sed -i 's/Nothing is nothing./Nothing is really nothing./' $dir/02_results.md
          if ARXIV_CORPUS=/tmp/extract-corpus ax split 2501.00001v3; then
            echo "a corrected file exited zero without anybody having accepted it"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/extract-corpus ax extract render 2501.00001v3; then
            echo "a re-extraction over a corrected file exited zero"
            exit 1
          fi
          grep -q "Nothing is really nothing." $dir/02_results.md
          # Accepting restamps the hash and marks the file edited. After that
          # the correction is the file, and the next run refuses it because
          # somebody decided rather than because something looks wrong.
          ARXIV_CORPUS=/tmp/extract-corpus ax split -accept 2501.00001v3
          grep -q "^edited: true" $dir/02_results.md
          ARXIV_CORPUS=/tmp/extract-corpus ax split 2501.00001v3 | grep -q "0 corrected"
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render 2501.00001v3 2>&1 | grep -q "1 left alone"
          # Force is the way past it and is deliberately not the default.
          ARXIV_CORPUS=/tmp/extract-corpus ax extract render -force 2501.00001v3 | grep -q "1 written"
          grep -q "Nothing is nothing." $dir/02_results.md
      - name: the split refuses the arguments it should refuse
        run: |
          if ax split; then
            echo "a split with nothing to split was allowed"
            exit 1
          fi
          for c in "split not-an-arxiv-id" "split 2501.00001v3"; do
            if ARXIV_CORPUS=/tmp/empty-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
      # The gate runs again at write time. Fetching and extracting are separate
      # runs and the licence can be re-resolved between them, so the check has
      # to be at the point something is about to be published and not only at
      # the point something was downloaded.
      - name: the gate refuses at write time and not only at fetch time
        run: |
          rm -rf /tmp/gate-corpus && cp -r /tmp/extract-corpus /tmp/gate-corpus
          rm -rf /tmp/gate-corpus/content
          sed -i 's/"licence_from":"abs"/"licence_from":"kaggle"/' /tmp/gate-corpus/metadata/2501.jsonl
          if ARXIV_CORPUS=/tmp/gate-corpus ax extract render 2501.00001v3; then
            echo "a licence read from a bulk surface was published as a licence for a version"
            exit 1
          fi
          if [ -e /tmp/gate-corpus/content ]; then
            echo "a refused extraction wrote into the content plane"
            exit 1
          fi
      - name: a rendering with a hole in the paper is rejected
        run: |
          mkdir -p /tmp/faulty-corpus/work/html/2501 /tmp/faulty-corpus/manifests
          cp extract/testdata/faulty.html /tmp/faulty-corpus/work/html/2501/2501.00001v3.html
          sum=$(sha256sum /tmp/faulty-corpus/work/html/2501/2501.00001v3.html | cut -d' ' -f1)
          cat > /tmp/faulty-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2501.00001"
              version: 3
              route: render
              url: https://arxiv.org/html/2501.00001v3
              path: work/html/2501/2501.00001v3.html
              sha256: $sum
              bytes: 1
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          out=$(ARXIV_CORPUS=/tmp/faulty-corpus ax extract render -n 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "inside the body of the paper"
          echo "$out" | grep -q "source path"
          if ARXIV_CORPUS=/tmp/faulty-corpus ax extract render -n 2501.00001v3; then
            echo "a rendering with a piece of the paper missing exited zero"
            exit 1
          fi
      # LaTeXML is a hundred megabytes of Perl and this job has no network, so
      # the converter here is a script that answers with the same fixture the
      # render path is tested against. What that leaves under test is everything
      # around the conversion, which is the part this project wrote: the
      # manifest lookup, the unpacking, the main file, the directory LaTeXML is
      # run in, the status line, the log and the reading of what came back.
      - name: a submission is read end to end with a stub converter
        run: |
          mkdir -p /tmp/source-corpus/work/source/2501 /tmp/source-corpus/manifests /tmp/source-corpus/metadata /tmp/submission/figures
          printf '%s\n' '\documentclass{article}' '\begin{document}' '\input{sections/one}' '\end{document}' > /tmp/submission/ms.tex
          mkdir -p /tmp/submission/sections
          printf 'A section that begins no document of its own.\n' > /tmp/submission/sections/one.tex
          printf 'not really a picture\n' > /tmp/submission/figures/plot.pdf
          tar -czf /tmp/source-corpus/work/source/2501/2501.00001v3.gz -C /tmp/submission ms.tex sections/one.tex figures/plot.pdf
          sum=$(sha256sum /tmp/source-corpus/work/source/2501/2501.00001v3.gz | cut -d' ' -f1)
          cat > /tmp/source-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2501.00001"
              version: 3
              route: source
              url: https://arxiv.org/e-print/2501.00001v3
              path: work/source/2501/2501.00001v3.gz
              sha256: $sum
              bytes: 1
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          # LaTeXML is two programs and this project runs them one at a time, so
          # the stub is two programs as well. The conversion writes the XML,
          # which is where the author's labels are, and writes the page the post
          # processor would have made from it; the post processor checks it was
          # handed the XML and leaves that page alone.
          cat > /tmp/stub-latexmlc <<SH
          #!/bin/sh
          case "\$1" in --VERSION) echo "a stub converter, and not LaTeXML"; exit 0;; esac
          for a in "\$@"; do case "\$a" in --dest=*) out="\${a#--dest=}";; esac; done
          test -f ms.tex || { echo "the converter was not run inside the submission" >&2; exit 3; }
          echo "Status:conversion:0"
          printf '<document><section xml:id="S1" labels="LABEL:sec:intro"/><figure xml:id="S1.F1" labels="LABEL:fig:plot"/></document>' > "\$out"
          cat "$PWD/extract/testdata/rendering.html" > "\${out%.xml}.html"
          SH
          chmod +x /tmp/stub-latexmlc
          cat > /tmp/stub-latexmlpost <<SH
          #!/bin/sh
          for a in "\$@"; do case "\$a" in --dest=*) out="\${a#--dest=}";; --*) ;; *) in="\$a";; esac; done
          test -f "\$in" || { echo "the post processor was not given the conversion's XML" >&2; exit 3; }
          test -f "\$out" || { echo "the stub conversion wrote no page" >&2; exit 3; }
          SH
          chmod +x /tmp/stub-latexmlpost
          ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc /tmp/stub-latexmlc -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 | tee /tmp/source.txt
          grep -q "A Paper About Nothing" /tmp/source.txt
          grep -q "faults      1, 0 of them inside the body" /tmp/source.txt
          # The author's own names, read out of the XML and matched back on by
          # the anchor, which is the same string in both documents.
          grep -q "labels      2" /tmp/source.txt
          # The submission is unpacked under work/ and the conversion is kept
          # beside it rather than inside it, because LaTeXML copies a paper's
          # pictures next to the document it writes.
          test -f /tmp/source-corpus/work/source/2501/2501.00001v3/sections/one.tex
          test -f /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.html
          test -f /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.html.log
          # The XML is kept as well, because the labels are in it and in nothing
          # else, and a paper looked at a second time is read back off disk.
          test -f /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.xml
      - name: the same submission is not converted twice
        run: |
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc /tmp/stub-latexmlc -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1)
          echo "$out"
          echo "$out" | grep -q "was converted already"
          # And the labels come back with it, off the XML beside the page.
          echo "$out" | grep -q "labels      2"
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -again -latexmlc /tmp/stub-latexmlc -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1)
          echo "$out"
          echo "$out" | grep -q "converting 2501.00001v3 from ms.tex"
      # The one field of the front matter that says how the file below it was
      # made. A paper read from the source path and a paper read from arXiv's
      # own rendering are not always the same document, and a reader comparing
      # two papers has nothing else to go on.
      - name: a paper read from the source path says so in its front matter
        run: |
          cp /tmp/extract-corpus/metadata/2501.jsonl /tmp/source-corpus/metadata/2501.jsonl
          ARXIV_CORPUS=/tmp/source-corpus ax extract source -latexmlc /tmp/stub-latexmlc -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 | grep -q "3 written"
          grep -q "^path: source" /tmp/source-corpus/content/en/2501/2501.00001/01_introduction.md
          # A section that is a whole file has no line in the body for an
          # attribute block, so its label goes in the front matter with its
          # identifier. The figure inside it carries its own on the line it
          # starts.
          grep -q "^label: sec:intro" /tmp/source-corpus/content/en/2501/2501.00001/01_introduction.md
          grep -q "label=fig:plot" /tmp/source-corpus/content/en/2501/2501.00001/01_introduction.md
      - name: a submission that is a PDF is a fact about the paper and not a failure
        run: |
          rm -rf /tmp/pdf-corpus && mkdir -p /tmp/pdf-corpus/work/source/2501 /tmp/pdf-corpus/manifests
          printf '%%PDF-1.5\nthe paper, as the author compiled it\n' | gzip > /tmp/pdf-corpus/work/source/2501/2501.00002v1.gz
          sum=$(sha256sum /tmp/pdf-corpus/work/source/2501/2501.00002v1.gz | cut -d' ' -f1)
          cat > /tmp/pdf-corpus/manifests/sources.yaml <<YAML
          sources:
            - id: "2501.00002"
              version: 1
              route: source
              url: https://arxiv.org/e-print/2501.00002v1
              path: work/source/2501/2501.00002v1.gz
              sha256: $sum
              bytes: 1
              fetched: 2026-09-14T00:00:00Z
              licence: cc-by
              licence_from: abs
          YAML
          out=$(ARXIV_CORPUS=/tmp/pdf-corpus ax extract source -n -latexmlc /tmp/stub-latexmlc -latexmlpost /tmp/stub-latexmlpost 2501.00002v1 2>&1)
          echo "$out"
          echo "$out" | grep -q "native path"
          echo "$out" | grep -q "1 of 1 submissions are a PDF"
          if [ -e /tmp/pdf-corpus/content ]; then
            echo "a submission with no source to read wrote into the content plane"
            exit 1
          fi
      # A machine with no LaTeXML is the ordinary state of a machine, and the
      # answer is one line a person runs once, so the refusal has to carry it.
      - name: a machine with no LaTeXML says how to get one
        run: |
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc latexmlc-that-is-not-installed 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "brew install latexml"
          echo "$out" | grep -q "apt install latexml"
          # Both programs are asked for, and the one named is the one missing.
          # A paper converted and then left as XML because the second program is
          # not there is minutes of work to arrive at a message about the first.
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc /tmp/stub-latexmlc -latexmlpost latexmlpost-that-is-not-installed 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "latexmlpost-that-is-not-installed is not on the PATH"
      # The second pass, and the reason there is one. LaTeXML skips the style
      # files a submission ships unless it is told to read them, and a paper
      # rejected for an undefined macro has usually lost one the author defined
      # in a .sty in the tarball. The stub here is the shape of that paper: it
      # answers with the faulty fixture, which is a rejection, until it is asked
      # to read the style files, and then it answers with the one that parses.
      - name: a rejected paper is converted again with the style files it ships
        run: |
          cat > /tmp/stub-styles <<SH
          #!/bin/sh
          case "\$1" in --VERSION) echo "a stub converter, and not LaTeXML"; exit 0;; esac
          for a in "\$@"; do case "\$a" in --dest=*) out="\${a#--dest=}";; esac; done
          echo "Warning:missing_file:authormacros Can't find package authormacros" >&2
          printf '<document/>' > "\$out"
          for a in "\$@"; do
            if [ "\$a" = "--includestyles" ]; then
              echo "Status:conversion:0" >&2
              cat "$PWD/extract/testdata/rendering.html" > "\${out%.xml}.html"
              exit 0
            fi
          done
          echo "Status:conversion:2" >&2
          cat "$PWD/extract/testdata/faulty.html" > "\${out%.xml}.html"
          SH
          chmod +x /tmp/stub-styles
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -again -latexmlc /tmp/stub-styles -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1)
          echo "$out"
          # The package it could not read is named once, which is the useful line
          # in a log that then says the same thing about every macro in it.
          echo "$out" | grep -q "LaTeXML could not read 1 package: authormacros"
          echo "$out" | grep -q "converting it again with the style files the submission ships"
          echo "$out" | grep -q "reading the style files fixed it"
          echo "$out" | grep -q "faults      1, 0 of them inside the body"
          if grep -q nothingmacro /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.html; then
            echo "the rejected first pass was left on disk"
            exit 1
          fi
      # The other half of the same decision. A .sty is a program and LaTeXML
      # reading one can come out worse than LaTeXML skipping it, so the pass that
      # is no better is thrown away rather than kept for having been second.
      - name: a second pass that is no better leaves the first conversion in place
        run: |
          cat > /tmp/stub-noworse <<SH
          #!/bin/sh
          case "\$1" in --VERSION) echo "a stub converter, and not LaTeXML"; exit 0;; esac
          for a in "\$@"; do case "\$a" in --dest=*) out="\${a#--dest=}";; esac; done
          echo "Status:conversion:2" >&2
          printf '<document pass="\$*"/>' > "\$out"
          cat "$PWD/extract/testdata/faulty.html" > "\${out%.xml}.html"
          SH
          chmod +x /tmp/stub-noworse
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -again -latexmlc /tmp/stub-noworse -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "reading the style files did not help"
          echo "$out" | grep -q "1 of 1 conversions are too broken to use"
          grep -q nothingmacro /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.html
          # The page of one pass beside the XML of the other would be a set of
          # labels pointing at anchors that are not there, so both files of the
          # conversion that was kept are the ones on disk.
          if grep -q -- "--includestyles" /tmp/source-corpus/work/converted/2501/2501.00001v3/paper.xml; then
            echo "the page of the first pass was left beside the XML of the second"
            exit 1
          fi
      # LaTeXML gives up after a hundred errors and writes what it had, which for
      # a paper that lost its packages in the preamble is a title with nothing
      # under it. That document carries no faults, because the errors happened
      # before there was anywhere to put them, so the fault count reads it as a
      # clean paper of no sections and the status is the only thing that knows.
      - name: a conversion that stopped partway through is refused
        run: |
          cat > /tmp/stub-fatal <<'SH'
