          case "$1" in --VERSION) echo "a stub converter, and not LaTeXML"; exit 0;; esac
          for a in "$@"; do case "$a" in --dest=*) out="${a#--dest=}";; esac; done
          echo "Fatal:too_many_errors:100 Too many errors; aborting" >&2
          echo "Status:conversion:3" >&2
          printf '<document/>' > "$out"
          printf '<!DOCTYPE html>\n<html><body><article class="ltx_document"><h1 class="ltx_title ltx_title_document">A Paper About Nothing</h1></article></body></html>\n' > "${out%.xml}.html"
          SH
          chmod +x /tmp/stub-fatal
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -again -latexmlc /tmp/stub-fatal -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "faults      none"
          echo "$out" | grep -q "LaTeXML stopped partway through"
          echo "$out" | grep -q "1 of 1 conversions are too broken to use"
          # And a document read back off disk rather than converted again keeps
          # that verdict, because the status is read out of the log beside it.
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc /tmp/stub-fatal -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "was converted already"
          echo "$out" | grep -q "LaTeXML stopped partway through"
      # The fixtures are four real files and a drawing. Rule F06 is what
      # separates a corpus from a mirror of copyrighted PDFs and rule F09 is
      # what keeps somebody else's figure out of a repository that claims to be
      # CC BY, so both are run here as well as in the unit tests.
      - name: an ordinary figure is committed and a page is not
        run: |
          out=$(ax figures check figures/testdata/plot.png figures/testdata/drawing.svg)
          echo "$out"
          echo "$out" | grep -q "1200 by 900"
          echo "$out" | grep -q "at 4.00 by 3.00 inches, from pHYs"
          echo "$out" | grep -q "at 4.00 by 3.00 inches, from svg"
          test "$(echo "$out" | grep -c 'verdict.*commit')" = 2
          out=$(ax figures check figures/testdata/page.png 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "100.0% of a page"
          echo "$out" | grep -q "F06"
          if ax figures check figures/testdata/page.png; then
            echo "a picture that covers a whole page was committed"
            exit 1
          fi
          if ax figures check figures/testdata/spacer.png; then
            echo "a twenty pixel spacer was committed as a figure"
            exit 1
          fi
