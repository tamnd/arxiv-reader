          #!/bin/sh
          case "$1" in -v) echo "a stub reader, and not pdftotext" >&2; exit 99;; esac
          cat /tmp/native-page-v7.txt
          printf '\f'
          SH
          chmod +x /tmp/stub-wrong-version
