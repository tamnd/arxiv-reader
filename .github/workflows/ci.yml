      # the way pdftotext behaves, which is the same arrangement latexml and
      # latex have. What that leaves under test is everything this project
      # wrote, and on this path that is nearly all of it: the manifest lookup,
      # the scan judgement, the margin stamp, the gutter, the headings, the
      # paragraphs, the captions and the reference list.
      #
      # The page is a two column page laid out the way -layout lays one out,
      # with a heading in each column, an indented paragraph in each, a caption
      # under the left one and a reference list under the right one. It is one
      # file rather than a heredoc inside the stub so that the alignment is
      # visible and so that the wrong version case can be made by editing the
      # stamp and nothing else.
      - name: a PDF is read end to end with a stub pdftotext
        run: |
          mkdir -p /tmp/native-corpus/work/pdf/2501 /tmp/native-corpus/manifests /tmp/native-corpus/metadata
          printf '%%PDF-1.5\n' > /tmp/native-corpus/work/pdf/2501/2501.00001v3.pdf
          sum=$(sha256sum /tmp/native-corpus/work/pdf/2501/2501.00001v3.pdf | cut -d' ' -f1)
