          # like, and each of the eleven fires on its own.
          copy && add $intro 'The cost is $n + 1 and nothing else.' && restamp && fails M01
          copy && add $intro 'Every point of $\R$ is a limit.' && restamp && fails M02
          copy && add $intro 'The bound is \frac{1}{2} of nothing.' && restamp && fails M03
          copy && add $intro 'The constant is [illegible] in the printed copy.' && restamp && fails M05
          copy && add $intro 'We know (see $x)$ that nothing converges.' && restamp && fails M07
          copy && add $intro '$$' 'a = 1 \\' 'b = 2' '$$' && restamp && fails M08
          copy && add $intro 'The term $x^{a}^{b}$ is in every row.' && restamp && soft M09
          copy && add $intro 'The claim is that $a \not b$ holds.' && restamp && fails M10
          copy && add $intro '\[' 'a = 1' '\]' && restamp && fails M11
          copy && add $intro 'The value $ x + 1 $ is the one.' && restamp && soft M12
          copy && add $intro '```' 'echo $HOME' '```' && restamp && fails M13
          # The twelfth is the one rule in the group that reads a paper rather
          # than a formula, so it is broken by taking every dollar in the paper
          # out and leaving the mathematics sitting in the prose. It fires with
          # M03 beside it, which is the point: a paper whose formulas were
          # dissolved is wrong in more than one way and green in none of them.
          copy && sed -i 's/\$//g' $front $intro $results && add $intro 'The step α is at most β whenever γ is small.' && restamp && fails M14
          # The register on its own, then the copy on its own, then the two
          # disagreeing. A tag lives in the register and in the file it was
          # written into, so each of those three is a different way for a paper
          # to end up with a name nothing resolves.
          copy && echo "ABC,s9" >> $reg && fails G01
          copy && printf '\nSee [Theorem 1](#VNYA) for the rest.\n' >> $intro && restamp && fails G02
          copy && echo "VIS1,s9" >> $reg && fails G03
          copy && echo "ZZZZ,s1" >> $reg && fails G04
          copy && sed -i 's/^tag: VIS1$/tag: ZZZZ/' $intro && fails G05
          copy && sed -i 's/ tag=VNYA//' $results && restamp && fails G06
          copy && sed -i 's/^ZZZZ,eq-7,gone:v2,/ZZZZ,eq-7,v2,/' $reg && fails G07
          # The one rule that reads the repository. The line is gone from the
          # file, so the corpus on its own cannot tell you it was ever there.
          copy && sed -i '/^ZZZZ,eq-7,/d' $reg && fails G08
          copy && sed -i 's/{#thm-1 .statement/{#thm-1 .theorem/' $results && restamp && fails X01
          # The pictures and the tables. A figure is a decision in the
          # manifest, bytes on disk and a line in a body, and these are the ways
          # those three come apart. The first is the one that matters most: a
          # body pointing back at arXiv is a paper ax figures has never been run
          # over, which is how every one of these starts out.
          copy && sed -i 's#](/figures/2501/2501.00001/nothing.svg)#](2501.00001v3/nothing.svg)#' $intro && restamp && fails F01
          copy && sed -i 's/^      width: 384$/      width: 20/' $man && fails F02
          copy && sed -i 's/^      bytes: 375$/      bytes: 999999/' $man && fails F03
          # F04 asks git rather than the corpus, so it is broken by putting bytes
          # under figures/ and not committing them, and then by telling git to
          # look away instead, which is the worse of the two.
          copy && cp $tab/t01.md /tmp/broken-corpus/figures/2501/2501.00001/two.svg && fails F04
          copy && echo '*.png' > /tmp/broken-corpus/.gitignore && cp $tab/t01.md /tmp/broken-corpus/figures/2501/2501.00001/two.png && fails F04
          copy && sed -i 's/^      page_fraction: 0.1283$/      page_fraction: 0.9/' $man && fails F06
          copy && sed -i 's/^      caption: (\*\*Overview\*\*.) Nothing, drawn.$/      caption: ""/' $man && fails F07
          copy && sed -i 's/^access: open$/access: record/' $front $intro $results && fails F08
          copy && sed -i 's/^      third_party: owned$/      third_party: suspected/' $man && fails F09
          copy && add $intro 'The proof is in Figure 9, which nobody drew.' && restamp && soft F10
          copy && rm $tab/t01.tex && fails F11
          copy && sed -i 's/0\.1/0.2/' $tab/t01.tex && fails F12
          # F05 is the one that needs a second figure, because one picture
          # committed twice is two entries and the corpus has two entries only
          # when something went wrong. The copy points at the bytes that are
          # already there, which is exactly the shape the rule is about.
          copy
          sum=$(grep -A2 'source: 2501.00001v3/nothing.svg' $man | grep sha256 | awk '{print $2}')
          printf '%s\n' \
            '    - paper: "2501.00001"' \
            '      version: 3' \
            '      number: "9"' \
            '      source: 2501.00001v3/again.svg' \
            '      file: /figures/2501/2501.00001/nothing.svg' \
            "      sha256: $sum" \
            '      bytes: 375' \
            '      format: svg' \
            '      third_party: owned' \
            '      caption: The same picture, committed a second time.' \
            '      licence: cc-by' >> $man
          fails F05
          # The bibliography and the edges built out of it. Four of the six read
          # the metadata plane the steps above filled, which is why these come
          # after the resolve and not with the rest of the content rules. T12 is
          # here too, because a link is only a link into nothing once the
          # bibliography is there to say it is not an entry.
          copy && add $intro 'The idea comes from arXiv:2401.99999 originally.' && restamp && fails R01
          copy && add $intro 'The bound is due to [9](#bib.bibx9), who proved it first.' && restamp && fails R02
          copy && sed -i 's/^      text: N. Nobody. On nothing. 1999.$/      text: ""/' $bib && fails R03
          copy && sed -i 's/^      title: Nothing In Particular, Revisited$/      title: Something Else Entirely/' $bib && soft R04
          copy && sed -i 's/^      resolved: "2303.00002"$/      resolved: "2501.00001"/' $bib && fails R05
          copy && sed -i 's/^      year: 1999$/      year: 2030/' $bib && soft R06
          copy && add $intro 'The proof is in [Appendix C](#app-c), which nobody wrote.' && restamp && fails T12
          # The licence gate read back off the files. S01 is broken in every
          # file of the paper rather than in one, because the access class is a
          # fact about the paper and a corpus where one file of three disagrees
          # is a different defect from the one this rule is about.
          copy && sed -i 's/^access: open$/access: verbatim/' $front $intro $results && fails S01
          copy && rm /tmp/broken-corpus/metadata/2501.jsonl && fails S04
          copy && sed -i 's/^version: v3$/version: v9/' $intro && fails S07
          copy && sed -i 's/^licence_from: abs$/licence_from: kaggle/' $intro && fails S10
          copy && sed -i 's/^licence: CC-BY-4.0$/licence: CC-BY-SA-4.0/' $intro && fails S12
      # The medians the soft thresholds are read from. Four papers against a
      # floor of thirty, so what is being tested here is the arithmetic and the
      # three states a cell can be in, and every number in the table is still in
      # brackets when it is over.
      - name: the medians are taken over a paper's own category
        run: |
          rm -rf /tmp/median-corpus && cp -r /tmp/extract-corpus /tmp/median-corpus
          rm -rf /tmp/median-corpus/.git
          dir=/tmp/median-corpus/content/en/2501
          copy() {
            cp -r $dir/2501.00001 $dir/$1
            sed -i "s/^paper: 2501.00001$/paper: $1/" $dir/$1/*.md
            printf '{"id":"%s","title":"A copy of the fixture","abstract":"A copy of the fixture, in another category.","authors":[{"surname":"First","forenames":"Ada"}],"categories":["%s"],"versions":[{"version":3,"created":"2025-02-02T00:00:00Z","licence":"cc-by","licence_from":"abs"}],"source":"oai","harvested":"2026-01-01"}\n' "$1" "$2" >> /tmp/median-corpus/metadata/2501.jsonl
          }
          copy 2501.00002 math.AG
          copy 2501.00003 math.AG
          copy 2501.00004 math.AG
          # Three more displays in one of the three math papers, which is the
          # review paper that a mean and a standard deviation would have let
          # loosen the threshold for the other two.
          printf '\n$$\nx = y\n$$\n\n$$\nx = z\n$$\n\n$$\nx = w\n$$\n' >> $dir/2501.00004/02_results.md
          # And a paper the plane has never heard of, which is group S's
          # finding rather than this command's.
          cp -r $dir/2501.00001 $dir/2501.00009
          sed -i "s/^paper: 2501.00001$/paper: 2501.00009/" $dir/2501.00009/*.md
          ARXIV_CORPUS=/tmp/median-corpus ax audit -baselines -n -q 2>/tmp/medians-say.txt | tee /tmp/medians.txt
          cat /tmp/medians-say.txt
          grep -qE '^cs\.LG +1 ' /tmp/medians.txt
          grep -qE '^math\.AG +3 ' /tmp/medians.txt
          # The one paper with three more displays did not move the median of
          # its category off the value the other two share, which is the whole
          # reason the spread is a median absolute deviation.
          one=$(awk '$1 == "cs.LG" { print $3 }' /tmp/medians.txt)
          three=$(awk '$1 == "math.AG" { print $3 }' /tmp/medians.txt)
          test -n "$one"
          test "$one" = "$three"
          # Every number is in brackets, because four papers is nowhere near
          # the floor and a number that is not a baseline has to read as one.
          test "$(grep -c '(' /tmp/medians.txt)" = 2
          grep -q "baselines   0, which is the categories with 30 papers or more" /tmp/medians-say.txt
          # None of the copies has a bibliography, and no bibliography is not a
          # resolution rate of nought.
          grep -qE '^math\.AG +3 +\([0-9.]+\) +none$' /tmp/medians.txt
          grep -q "2501.00009: the metadata plane has no record of this paper" /tmp/medians-say.txt
          grep -q "papers      4 over 2 categories" /tmp/medians-say.txt
          test ! -f /tmp/median-corpus/manifests/baselines.yaml
      - name: a run that is not a dry run writes the medians down
        run: |
          ARXIV_CORPUS=/tmp/median-corpus ax audit -baselines -q 2>/tmp/medians-written.txt
          grep -q "written to manifests/baselines.yaml" /tmp/medians-written.txt
          file=/tmp/median-corpus/manifests/baselines.yaml
          # The floor the file was built under is written into it, because a
          # file read by a later version of this tool should be judged by the
          # rule it was made with and not by one that moved since.
          grep -q "^floor: 30" $file
          grep -q "^papers: 4" $file
          grep -q "category: math.AG" $file
          grep -q "displays_per_page:" $file
          # And the category with no bibliography behind it has no line for
          # that metric at all.
          test "$(grep -c 'references_resolved:' $file)" = 1
      - name: the baselines refuse the arguments they should refuse
        run: |
          rm -rf /tmp/nobase-corpus && mkdir -p /tmp/nobase-corpus
          # A baseline is a description of papers, and a corpus with no papers
          # in it has to say so rather than write a file with nothing in it.
          if ARXIV_CORPUS=/tmp/nobase-corpus ax audit -baselines; then
            echo "the baselines were computed over an empty content plane"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/median-corpus ax audit -baselines -shard 2113; then
            echo "2113 was allowed"
            exit 1
          fi
          if ARXIV_CORPUS=/tmp/median-corpus ax audit -baselines -shard 2502; then
            echo "a month with nothing extracted in it was allowed"
            exit 1
          fi
      - name: the audit refuses the arguments it should refuse
        run: |
          for c in "audit --plane both" "audit -rules S99" "audit -rules" "audit -cap 0" "audit -shard 2113" "audit meta"; do
            if ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
          # A rule belongs to one plane, and asking for a metadata rule over the
          # content plane is a question with no answer rather than an empty one.
          for c in "audit -plane content -rules S14" "audit -plane meta -rules T05" "audit -plane content -shard 2113"; do
            if ARXIV_CORPUS=/tmp/extract-corpus ax $c; then
              echo "ax $c was allowed"
              exit 1
            fi
          done
