          # it in the right hand column, which is there because the left
          # column's prose runs alongside it and the gap rule cannot see it.
          grep -q "headings    3" /tmp/native.txt
          grep -q "blocks      1 figure, 4 paragraph" /tmp/native.txt
          # The reference list has no heading over it and is found by the three
          # entries numbered one, two and three in the back half of the paper.
          grep -q "references  3" /tmp/native.txt
          grep -q "1 of them typeset" /tmp/native.txt
      # The columns are the whole of this path. A two column page read without
      # them is every sentence interleaved with a different sentence, so this
      # asks the text rather than the counts.
      - name: the columns of a two column page are kept apart
        run: |
          ARXIV_CORPUS=/tmp/native-corpus ax extract native -n -outline -pdftotext /tmp/stub-pdftotext 2501.00001v3 2>&1 | tee /tmp/native-outline.txt
