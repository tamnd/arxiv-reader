          # that verdict, because the status is read out of the log beside it.
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -latexmlc /tmp/stub-fatal -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1 || true)
