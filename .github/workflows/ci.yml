          cat > /tmp/stub-noworse <<SH
          #!/bin/sh
          case "\$1" in --VERSION) echo "a stub converter, and not LaTeXML"; exit 0;; esac
          for a in "\$@"; do case "\$a" in --dest=*) out="\${a#--dest=}";; esac; done
          echo "Status:conversion:2" >&2
          printf '<document pass="\$*"/>' > "\$out"
          cat "$PWD/extract/testdata/faulty.html" > "\${out%.xml}.html"
          SH
          chmod +x /tmp/stub-noworse
          out=$(ARXIV_CORPUS=/tmp/source-corpus ax extract source -n -again -latexmlc /tmp/stub-noworse -latexmlpost /tmp/stub-latexmlpost 2501.00001v3 2>&1 || true)
