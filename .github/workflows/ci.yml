          cp /tmp/extract-corpus/metadata/2501.jsonl /tmp/native-corpus/metadata/2501.jsonl
          ARXIV_CORPUS=/tmp/native-corpus ax extract native -pdftotext /tmp/stub-pdftotext 2501.00001v3 | tee /tmp/native-write.txt
