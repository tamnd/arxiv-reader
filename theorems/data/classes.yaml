# Theorem-like environments that a document class or a package defines before the paper declares anything (AX3.2).
# Each entry is an environment with its title, its counter, and whether it is numbered.
# shared names the environment whose counter it uses. A proof entry is a proof environment.
classes:
  llncs:
    - {env: theorem, title: Theorem}
    - {env: lemma, title: Lemma}
    - {env: corollary, title: Corollary}
    - {env: proposition, title: Proposition}
    - {env: definition, title: Definition}
    - {env: example, title: Example}
    - {env: exercise, title: Exercise}
    - {env: problem, title: Problem}
    - {env: property, title: Property}
    - {env: question, title: Question}
    - {env: solution, title: Solution}
    - {env: conjecture, title: Conjecture}
    - {env: remark, title: Remark, numbered: false}
    - {env: note, title: Note, numbered: false}
    - {env: case, title: Case}
    - {env: claim, title: Claim, numbered: false}
    - {env: proof, title: Proof, numbered: false, proof: true}
