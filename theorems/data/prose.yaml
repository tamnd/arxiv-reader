# Cue patterns for prose items (AX7.4).
# Each cue is a lower case phrase. The understand role reads the sentences that hold a cue.
# Three dots in a cue match one to eight words, so "define ... to be" matches "define the rank of M to be".
# The cue finder also marks a sentence with an emphasized term and "if" or "such that" as a definition, with the cue "emphasis".
# The census does not count prose items, because code cannot count them (AX1.4).
definition:
  - we say that
  - is said to be
  - is called
  - are called
  - we call
  - we define
  - is defined as
  - is defined to be
  - let us call
  - will be called
  - we denote by
  - denote by
  - we write
  - define ... to be
  - by a ... we mean
  - by an ... we mean
  - we refer to ... as
conjecture:
  - we conjecture
  - it is conjectured
  - conjecturally
  - we expect that
problem:
  - it is not known whether
  - it is unknown whether
  - it would be interesting to
  - an open question
  - remains open
  - we ask whether
  - it is an open problem
  - it is an open question
  - it is open whether
  - we do not know
  - it is unclear whether
claim:
  - we claim that
  - we show that
  - we prove that
hypothesis:
  - throughout this paper
  - throughout the paper
  - throughout this section
  - from now on
  - in the rest of the paper
  - we assume that
  - we always assume
